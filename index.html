<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIT Bombay Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
      :root {
        /* Light Mode Palette (Default if no dark class, but we default html to dark) */
        --color-slate-50:  #020617;
        --color-slate-100: #0f172a; /* Darkest Text */
        --color-slate-200: #1e293b; /* High Contrast Text */
        --color-slate-300: #334155; /* Text */
        --color-slate-400: #475569; /* Muted Text */
        --color-slate-500: #64748b; /* Muted */
        --color-slate-600: #94a3b8; /* Inputs */
        --color-slate-700: #cbd5e1; /* Borders */
        --color-slate-750: #e2e8f0; /* Subtle BG */
        --color-slate-800: #ffffff; /* Card BG */
        --color-slate-900: #f8fafc; /* Main BG */
      }

      .dark {
        /* Dark Mode Palette (Original Slate Colors) */
        --color-slate-50:  #f8fafc;
        --color-slate-100: #f1f5f9;
        --color-slate-200: #e2e8f0;
        --color-slate-300: #cbd5e1;
        --color-slate-400: #94a3b8;
        --color-slate-500: #64748b;
        --color-slate-600: #475569;
        --color-slate-700: #334155;
        --color-slate-750: #2d3748;
        --color-slate-800: #1e293b;
        --color-slate-900: #0f172a;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-slate-900);
        color: var(--color-slate-200);
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-slate-700);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-slate-600);
      }
      
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: var(--color-slate-800);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--color-slate-600);
        border-radius: 2px;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: 'var(--color-slate-50)',
                100: 'var(--color-slate-100)',
                200: 'var(--color-slate-200)',
                300: 'var(--color-slate-300)',
                400: 'var(--color-slate-400)',
                500: 'var(--color-slate-500)',
                600: 'var(--color-slate-600)',
                700: 'var(--color-slate-700)',
                750: 'var(--color-slate-750)',
                800: 'var(--color-slate-800)',
                850: '#1a202c', 
                900: 'var(--color-slate-900)',
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@0.294.0",
    "recharts": "https://esm.sh/recharts@2.12.0"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
